name: Codecollab CI/CD 

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      nginx: ${{ steps.filter.outputs.nginx }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            nginx:
              - 'nginx/**'
            compose:
              - 'docker-compose.yml'

  build-backend:
    name: Build Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize Docker Username
        id: prep
        run: |
          CLEAN_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]' | xargs)
          echo "docker_user=$CLEAN_USER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.prep.outputs.docker_user }}/codecollab-backend:${{ github.sha }}
            ${{ steps.prep.outputs.docker_user }}/codecollab-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize Docker Username
        id: prep
        run: |
          CLEAN_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]' | xargs)
          echo "docker_user=$CLEAN_USER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.prep.outputs.docker_user }}/codecollab-frontend:${{ github.sha }}
            ${{ steps.prep.outputs.docker_user }}/codecollab-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [detect-changes, build-backend, build-frontend]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.detect-changes.outputs.backend == 'true' ||
       needs.detect-changes.outputs.frontend == 'true' ||
       needs.detect-changes.outputs.nginx == 'true' ||
       needs.detect-changes.outputs.compose == 'true')
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy through SSH
        env: 
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          TARGET_DIR: /home/ubuntu/codecollab
          DEPLOY_BACKEND: ${{ needs.detect-changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          DEPLOY_COMPOSE: ${{ needs.detect-changes.outputs.compose }}
          DEPLOY_NGINX: ${{ needs.detect-changes.outputs.nginx }}
        run: |
          set -euo pipefail

          # Normalize docker username to lowercase
          CLEAN_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]' | xargs)

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # 1. Ensure target directory exists on remote host
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p $TARGET_DIR"

          # 2. Transfer docker-compose.yml to target directory
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            docker-compose.yml "$SERVER_USER@$SERVER_HOST:$TARGET_DIR/docker-compose.yml"

          # 3. Transfer nginx configuration if updated
          if [ "$DEPLOY_NGINX" = "true" ]; then
            echo "Nginx configuration changed, syncing /home/ubuntu/nginx/nginx.conf..."
            scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              nginx/nginx.conf "$SERVER_USER@$SERVER_HOST:/home/ubuntu/nginx/nginx.conf"
          fi

          # 4. Determine services to pull and recreate
          SERVICES_TO_DEPLOY=""
          if [ "$DEPLOY_BACKEND" = "true" ]; then
            SERVICES_TO_DEPLOY="$SERVICES_TO_DEPLOY backend"
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            SERVICES_TO_DEPLOY="$SERVICES_TO_DEPLOY frontend"
          fi
          if [ "$DEPLOY_NGINX" = "true" ]; then
            SERVICES_TO_DEPLOY="$SERVICES_TO_DEPLOY proxy"
          fi

          # If only docker-compose.yml changed, redeploy all defined services
          if [ -z "$SERVICES_TO_DEPLOY" ] && [ "$DEPLOY_COMPOSE" = "true" ]; then
            SERVICES_TO_DEPLOY="backend frontend proxy mongo"
          fi

          echo "Target services to update: $SERVICES_TO_DEPLOY"

          # 5. Remote pull and rolling restart only target services
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "cd $TARGET_DIR && \
             export DOCKER_USERNAME='$CLEAN_USER' && \
             docker compose pull $SERVICES_TO_DEPLOY && \
             docker compose up -d --no-deps $SERVICES_TO_DEPLOY"

          rm -f ~/.ssh/deploy_key
