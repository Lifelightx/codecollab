events {
    worker_connections 1024;
}

http{
	
	client_max_body_size 100M;
	
	limit_conn_zone $binary_remote_addr
        zone=per_ip_connections:10m;

   	# Request rate limiting: 10 requests per second per IP
	limit_req_zone $binary_remote_addr
        zone=general_limit:10m
        rate=10r/s;

   	 limit_req_status 429;
   	 limit_conn_status 429;

	server {
		listen 80;
		server_name jeeban.life www.jeeban.life;
        	return 301 https://$host$request_uri;
	}
	server {
		listen 443 ssl;
		server_name jeeban.life www.jeeban.life;

		ssl_certificate /etc/letsencrypt/live/jeeban.life/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/jeeban.life/privkey.pem;

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;

		location / {

			limit_conn per_ip_connections 20;
			limit_req zone=general_limit burst=30 nodelay;

			proxy_pass http://frontend:80;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwadred-For $proxy_add_x_forwarded_for;
			proxy_set_header Host $host;
		}
		location /api {
			proxy_pass http://backend:5000;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwadred-For $proxy_add_x_forwarded_for;
                        proxy_set_header Host $host;

		}
		location /socket.io {
			proxy_pass http://backend:5000;
			proxy_http_version 1.1;
  			proxy_set_header Upgrade $http_upgrade;
    			proxy_set_header Connection "upgrade";
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwadred-For $proxy_add_x_forwarded_for;
                        proxy_set_header Host $host;

		}
		location /s/ {
    		proxy_pass http://backend:5000/s/;
		}

	}
}