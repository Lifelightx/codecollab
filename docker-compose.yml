
services:
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "443:443"
      - "80:80"
    networks:
      - app-network
    volumes:
      - "/home/ubuntu/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "/etc/letsencrypt:/etc/letsencrypt:ro" 
  frontend:
    image: ${DOCKER_USERNAME}/codecollab-frontend:${FRONTEND_TAG:-latest}
    container_name: codecollab-frontend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    image: ${DOCKER_USERNAME}/codecollab-backend:${BACKEND_TAG:-latest}
    container_name: codecollab-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/appdb
    volumes:
      - "/home/ubuntu/UPLOADS:/app/uploads:rw"
    networks:
      - app-network
    depends_on:
      - mongo

  cli-ssh:
    image: ${DOCKER_USERNAME}/codecollab-cli-ssh:${CLI_TAG:-latest}
    container_name: codecollab-cli-ssh
    restart: unless-stopped
    ports:
      - "2222:2222"
    environment:
      - SSH_PORT=2222
      - BACKEND_URL=http://backend:5000
    networks:
      - app-network
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
