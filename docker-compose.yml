
services:
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "443:443"
      - "80:80"
    networks:
      - app-network
    volumes:
      - "/home/ubuntu/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "/etc/letsencrypt:/etc/letsencrypt:ro" 
  frontend:
    image: jeebanjyotimallik/frontend:latest
    container_name: codecollab-frontend
    restart: unless-stopped
    environment:
      - VITE_SOCKET_URL=/
      - VITE_API_URL=/api
    networks:
      - app-network

  backend:
    image: jeebanjyotimallik/backend:latest
    container_name: codecollab-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/appdb
    networks:
      - app-network
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
